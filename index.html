    <!-- Private/app SPA routes share this single index.html. Switch them to
         noindex so only the public marketing/guide pages are indexed. Keep this
         list in sync with PRIVATE_ROUTES in seo/seo.config.mjs. -->
    <script>
      (function () {
        var PRIVATE = [
          "/upload",
          "/dashboard",
          "/feedback",
          "/account",
          "/admin",
          "/auth",
          "/login",
          "/signup",
          "/settings",
        ];
        var p = location.pathname.replace(/\/+$/, "") || "/";
        var isPrivate = PRIVATE.some(function (r) {
          return p === r || p.indexOf(r + "/") === 0;
        });
        if (isPrivate) {
          var robots = document.getElementById("robots-meta");
          if (robots) robots.setAttribute("content", "noindex, nofollow");
          var canon = document.getElementById("canonical-link");
          if (canon) canon.setAttribute("href", location.origin + location.pathname);
        }
      })();
    </script>
